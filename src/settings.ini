[Hotkeys]
; AHK v2 hotkey format is used.
; Modifier symbols: ^ = Ctrl, ! = Alt, + = Shift, # = Win
; Examples: ^+F8  ^Numpad4  !F1  #Space
toggleHighlight=^+F8
moveMousePos=^Numpad4
movePrevMousePos=^Numpad7
saveMousePos=^Numpad6
handlePause=Pause
handleRecording=^Numpad0
typeFromClipboard=^.

[Conf]
; Ring outer diameter (pixels)
diameter=48
; Ring thickness (pixels)
thickness=4
; Ring transparency (0-255)
ringTransparency=190
; Inner circle transparency (0-255)
circleTransparency=170
; Animation transparency (0-255)
animTransparency=255
; Transparency at end of animation (0-255)
endTransparency=0
; Number of animation steps
steps=15
; Animation start diameter (pixels)
startDiameter=10
; Animation end diameter (pixels)
endDiameter=50
; Animation target frame time (ms)
animTargetFrameTime=16.67
; Gap between rings and inner circles (pixels)
padding=3

[Colors]
; Color format: ARGB hexadecimal (e.g. 0xFFRRGGBB)
; Default color - background (transparent white)
defaultBack=0x00FFFFFF
; Default color - border (cyan)
defaultBorder=0xFF00FFFF
; Left click - background (red)
leftBack=0xFFFF0000
; Left click - border (cyan)
leftBorder=0xFF00FFFF
; Middle click - background (cyan)
middleBack=0xFF00FFFF
; Middle click - border (magenta)
middleBorder=0xFFFF00FF
; Right click - background (green)
rightBack=0xFF00FF00
; Right click - border (red)
rightBorder=0xFFFF0000
